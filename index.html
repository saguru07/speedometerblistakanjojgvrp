<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Template</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Ikon (stroke-only, warna mengikuti currentColor) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="ic-engine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h5M10.5 6V8M6 8h8l2 2h2v-1.5h2V15h-2v-1.5h-2l-2 3.5H7.5L6 15.5H4V11h2z"/>
        </symbol>
        <symbol id="ic-fuel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 21V4h9v17M3 21h13M5 10h9M14 8h2.5l2 2v7a1.5 1.5 0 0 0 3 0V8l-3-3"/>
        </symbol>
        <symbol id="ic-belt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="2.2"/><path d="M8 21l1.5-9L7 9.5h8.5L14 21M9.5 12l7 5"/>
        </symbol>
        <symbol id="ic-beam" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 5a7 7 0 0 0 0 14zM14 7.5h7M14 12h7M14 16.5h7"/>
        </symbol>
        <symbol id="ic-arrow" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2 12l9-8v5h11v6H11v5z"/>
        </symbol>
    </svg>

    <main class="speedometer">
        <div class="gears" id="gears" aria-label="Gear"></div>

        <div class="gauges">
            <!-- Lampu di antara dial -->
            <span class="lamp pos-top-right" id="lamp-headlights"><svg><use href="#ic-beam"/></svg></span>
            <span class="lamp green pos-bottom-left" id="lamp-engine"><svg><use href="#ic-engine"/></svg></span>
            <span class="lamp red pos-bottom-right" id="lamp-seatbelt"><svg><use href="#ic-belt"/></svg></span>

            <!-- Tachometer -->
            <svg class="gauge" viewBox="0 0 200 200" role="img" aria-label="RPM">
                <circle class="face" cx="100" cy="100" r="96"/>
                <g id="tach-scale"></g>
                <text class="sub" x="100" y="146">x1000 rpm</text>
                <g class="needle" id="needle-rpm"><line x1="100" y1="114" x2="100" y2="26"/></g>
                <circle class="hub" cx="100" cy="100" r="9"/>
            </svg>

            <!-- Speedometer -->
            <svg class="gauge" viewBox="0 0 200 200" role="img" aria-label="Speed">
                <circle class="face" cx="100" cy="100" r="96"/>
                <g id="speed-scale"></g>
                <text class="sub" x="100" y="62">mph</text>
                <rect class="lcd" x="64" y="138" width="72" height="16" rx="2"/>
                <text class="lcdtxt" id="odometer" x="100" y="146">0.0 mi</text>
                <text class="digital" id="speed" x="100" y="124">0 MPH</text>
                <use class="ind" id="lamp-left" href="#ic-arrow" x="46" y="111" width="18" height="16"/>
                <g transform="translate(154 111) scale(-1 1)"><use class="ind" id="lamp-right" href="#ic-arrow" width="18" height="16"/></g>
                <g class="needle" id="needle-speed"><line x1="100" y1="114" x2="100" y2="24"/></g>
                <circle class="hub" cx="100" cy="100" r="9"/>
            </svg>

            <!-- Fuel + Engine Health (saling berhadapan) -->
            <svg class="gauge" viewBox="0 0 200 200" role="img" aria-label="Fuel and engine health">
                <circle class="face" cx="100" cy="100" r="96"/>
                <g id="fuel-scale"></g>
                <g id="health-scale"></g>
                <use class="icon" href="#ic-fuel" x="79" y="90" width="20" height="20"/>
                <use class="icon" href="#ic-engine" x="101" y="90" width="20" height="20"/>
                <g class="needle small" id="needle-fuel" style="transform-origin:70px 100px"><line x1="70" y1="106" x2="70" y2="52"/></g>
                <g class="needle small" id="needle-health" style="transform-origin:130px 100px"><line x1="130" y1="106" x2="130" y2="52"/></g>
                <circle class="hub" cx="70" cy="100" r="6"/>
                <circle class="hub" cx="130" cy="100" r="6"/>
            </svg>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
